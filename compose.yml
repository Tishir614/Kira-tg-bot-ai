services:
  kira:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FSM_REDIS_URL: ${FSM_REDIS_URL:-redis://redis:6379/0}
      DATA_DIR: /app/static
      DND_WEBAPP_URL: ${DND_WEBAPP_URL:-http://127.0.0.1:8080/dnd}
      LOCAL_IMAGE_BASE_URL: ${LOCAL_IMAGE_BASE_URL:-http://comfyui:8188}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-DreamShaper_8_pruned.safetensors}
      LOCAL_STT_BASE_URL: ${LOCAL_STT_BASE_URL:-http://local-stt:8080}
      KIRA_WEBAPP_URL: ${KIRA_WEBAPP_URL:-}
      SKETCHFORGE_PUBLIC_URL: ${SKETCHFORGE_PUBLIC_URL:-}
      OMNIGET_BIN: ${OMNIGET_BIN:-omniget}
      OMNIGET_TELEGRAM_MAX_MB: ${OMNIGET_TELEGRAM_MAX_MB:-49}
      PIPER_DATA_DIR: ${PIPER_DATA_DIR:-/app/static/piper}
      # D&D Mini App/API must listen on the container network so reverse proxies can reach it.
      WEB_PANEL_HOST: 0.0.0.0
      WEB_PANEL_PORT: 8080
      AUTO_RECOVERY_RESTART: ${AUTO_RECOVERY_RESTART:-1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kira-data:/app/static
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read(32)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - kira-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.34.1
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - kira-ollama:/root/.ollama

  comfyui-model:
    image: curlimages/curl:8.16.0
    profiles: ["image"]
    user: "0:0"
    restart: "no"
    volumes:
      - kira-image-models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        FILE="/models/${COMFYUI_CHECKPOINT:-DreamShaper_8_pruned.safetensors}"
        URL="${COMFYUI_MODEL_URL:-https://huggingface.co/Lykon/DreamShaper/resolve/main/DreamShaper_8_pruned.safetensors?download=true}"
        if [ -s "$$FILE" ]; then echo "ComfyUI model already present: $$FILE"; exit 0; fi
        rm -f "$$FILE.part"
        curl -fL --retry 8 --retry-delay 3 --connect-timeout 30 "$$URL" -o "$$FILE.part"
        mv "$$FILE.part" "$$FILE"

  comfyui:
    build:
      context: ./deploy/comfyui
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:-v0.36.0}
    profiles: ["image"]
    restart: unless-stopped
    volumes:
      - kira-image-models:/opt/comfyui/models/checkpoints:ro
      - kira-comfy-output:/opt/comfyui/output
    depends_on:
      comfyui-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read(64)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  local-stt-model:
    image: curlimages/curl:8.12.1
    profiles: ["voice"]
    user: "0:0"
    restart: "no"
    volumes:
      - kira-stt-models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        FILE="/models/${LOCAL_STT_MODEL_FILE:-ggml-base.bin}"
        URL="${LOCAL_STT_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true}"
        [ -s "$$FILE" ] && exit 0
        curl -fL --retry 8 --retry-delay 3 "$$URL" -o "$$FILE.part"
        mv "$$FILE.part" "$$FILE"

  local-stt:
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ["voice"]
    restart: unless-stopped
    volumes:
      - kira-stt-models:/models:ro
    depends_on:
      local-stt-model:
        condition: service_completed_successfully
    entrypoint: ["whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--language", "auto", "--no-timestamps", "--convert", "-m", "/models/${LOCAL_STT_MODEL_FILE:-ggml-base.bin}", "-t", "${LOCAL_STT_THREADS:-4}"]

  sketchforge:
    image: ghcr.io/formsmith746/sketchforge-3d:sha-4f3859f
    profiles: ["3d"]
    restart: unless-stopped
    environment:
      SKETCHFORGE_SHARED_PROJECTS_DIR: /data/projects
    volumes:
      - kira-sketchforge-projects:/data/projects
    ports:
      - "127.0.0.1:${SKETCHFORGE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s


  nginx:
    image: nginx:1.27-alpine
    profiles: ["webapp"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro

volumes:
  kira-data:
    name: kira-persistent-data
  kira-redis:
  kira-ollama:
  kira-image-models:
  kira-comfy-output:
  kira-stt-models:
  kira-sketchforge-projects:
