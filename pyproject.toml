[project]
name = "kirabot"
version = "2.9.1"
description = "Modular Telegram assistant with AI, web tools, media, moderation and games"
authors = [{ name = "Tishir code" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.15",
    "aiogram>=3.31.0,<4.0.0",
    "aiosqlite>=0.22.1",
    "fluent-logger-pyramid>=0.0.3",
    "fluent-runtime>=0.4.0",
    "fluent-syntax>=0.19.0",
    "gitpython>=3.1.46",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pyrogram>=2.0.106",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52,<2.1.0",
    "unidecode>=1.4.0",
    "yt-dlp[default]>=2026.8.19",
    "shazamio>=0.8.1,<1.0.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "alembic>=1.16.5",
    "piper-tts>=1.8.0,<2.0.0",
    "redis>=8.1.0,<9.0.0",
    "ddgs>=9.16.0,<10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]
